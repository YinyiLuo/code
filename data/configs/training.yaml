# Replace BAGEL_DATA_ROOT with the directory containing these training sets.

vlm_sft_reasoning:
  dataset_names:
    - scienceqa_train
    - ai2d_train
  image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
    max_pixels: 2007040
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: false
  shuffle_lines: true
  shuffle_seed: 42
  weight: 1.0

vlm_sft_ocr:
  dataset_names:
    - textvqa_train
  image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
    max_pixels: 2007040
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: false
  shuffle_lines: true
  shuffle_seed: 42
  weight: 0.5

instructpix2pix_flow:
  dataset_names:
    - train
  image_transform_args:
    image_stride: 16
    max_image_size: 768
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 448
    min_image_size: 224
  need_vit_condition: false
  is_mandatory: false
  weight: 1.0
